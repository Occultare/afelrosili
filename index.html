<script>
(function(){
  const IW=1200, IH=1800, frame=document.getElementById('frame'), cv=document.getElementById('c'), fb=document.getElementById('fallback');
  const wd=document.getElementById('word');
  wd.setAttribute('aria-label',wd.textContent);
  wd.innerHTML=[...wd.textContent].map((c,i)=>`<span aria-hidden="true" style="transition-delay:${(i*0.28).toFixed(2)}s">${c}</span>`).join('');
  const DEBUG=location.hash==='#mask';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let gl=null;
  try { gl=cv.getContext('webgl',{antialias:false,premultipliedAlpha:false}); } catch(e){}
  function layout(){
    const vw=innerWidth, vh=innerHeight, ar=IW/IH; let w,h;
    if (vw/vh < 0.8) { if (vw/vh > ar) { w=vw; h=vw/ar; } else { h=vh; w=vh*ar; } }
    else { h=vh; w=h*ar; }
    frame.style.width=w+'px'; frame.style.height=h+'px';
    const d=Math.min(devicePixelRatio||1,2);
    cv.width=Math.round(w*d); cv.height=Math.round(h*d);
    if (gl) gl.viewport(0,0,cv.width,cv.height);
  }
  addEventListener('resize',layout); layout();
  function fail(){ cv.remove(); fb.style.visibility='visible'; setTimeout(()=>wd.classList.add('on'),400); }
  if(!gl){ fail(); return; }
  const vs=`attribute vec2 p; varying vec2 uv; void main(){ uv=vec2(p.x*.5+.5, .5-p.y*.5); gl_Position=vec4(p,0.,1.); }`;
  const fs=`precision highp float; varying vec2 uv;
  uniform sampler2D img, msk; uniform float t, amp, seed, dbg, sep, live, shake;
  const vec2 R=vec2(1200.,1800.);
  const vec2 C=vec2(600.,1017.);
  const vec2 DIR=vec2(.92718,-.37461);
  const vec2 NRM=vec2(.37461,.92718);
  float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
  float side(vec2 p){
    vec2 q=p-C; float a=dot(q,DIR);
    float j=(n(vec2(a/120.,1.3))-.5)*80. + (n(vec2(a/28.,7.1))-.5)*22. + (n(vec2(a/7.,4.2))-.5)*5.;
    return dot(q,NRM)-j;

  bool inside(vec2 p){ return p.x>=0. && p.y>=0. && p.x<=R.x && p.y<=R.y; }
  vec3 shade(vec2 src){
    float m = texture2D(msk, src).r;
    float gust = .55 + .45*smoothstep(.2,.8, n(vec2(t*.12, 3.7)));

    float jit  = n(src*vec2(52.,44.) + vec2(t*.6, -t*.45)) - .5;
    vec2 off = vec2(wave*1.7 + jit*.45, wave*.6 + jit*.25) * m * gust * amp * live;
    vec3 c = texture2D(img, src + off).rgb;
    return mix(c, vec3(1.,.15,.1), m*.7*dbg);
  }
