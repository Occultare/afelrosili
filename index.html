  html, body { height:100%; margin:0; background:#000; overflow:hidden; }
  #c { position:fixed; left:0; top:0; display:block; }
  #dbg { position:fixed; left:8px; top:8px; z-index:9; font:11px/1.4 monospace; color:#9f9; background:rgba(0,0,0,.7); padding:6px 8px; white-space:pre-wrap; max-width:90vw; }

  #frame { position:relative; container-type:inline-size; flex:none; }
  #frame img { position:absolute; inset:0; width:100%; height:100%; visibility:hidden; }
  #word {
    position:absolute; left:50%; top:54.7%;
    transform:translate(-50%,-50%) rotate(-28deg);
    margin:0; font-family:'Jost', 'Helvetica Neue', Arial, sans-serif; font-weight:300;
    font-size:4.3cqw; letter-spacing:.42em; padding-left:.42em;
    color:#d9d6cf; white-space:nowrap; user-select:none;
    text-shadow:0 0 .6em rgba(0,0,0,.9);
  }
  #word span { display:inline-block; opacity:0; transform:translateX(2.8em); filter:blur(6px);
    transition:transform 2.4s cubic-bezier(.16,1,.3,1), opacity 1.8s ease, filter 2.2s ease; }
  #word.on span { opacity:.6; transform:none; filter:blur(0); }
  @media (max-aspect-ratio: 4/5) { #word { font-size:5.4cqw; } }
  #word.reset span { transition:none; }
  #snd { position:fixed; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px));
    background:none; border:0; padding:8px 10px; cursor:pointer; font:300 13px/1 'Jost','Helvetica Neue',Arial,sans-serif;
    letter-spacing:.3em; color:#d9d6cf; opacity:.32; transition:opacity .4s ease; }
  #snd:hover, #snd:focus-visible { opacity:.75; }
  #snd:focus-visible { outline:1px solid rgba(217,214,207,.5); outline-offset:2px; }
  #snd[aria-pressed="true"] { opacity:.6; }
  #snd[aria-pressed="false"] span { text-decoration:line-through; text-decoration-thickness:1px; }
  @media (prefers-reduced-motion: reduce){ #word span{ transition:opacity 1s ease; transform:none; } }
</style>

oooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooooor/2Q==')]).then(()=>{
    gl.uniform1i(U('img'),0); gl.uniform1i(U('msk'),1);
    gl.uniform1f(U('amp'), reduce?0.:6.5/1200.);
    gl.uniform1f(U('dbg'), DEBUG?1.:0.);
    gl.uniform1f(U('seed'), 7.31);
    const DELAY=reduce?0:1.8, DUR=reduce?0:2.9, END=DELAY+DUR;
    let textOn=false, t0=performance.now(), impacted=false, grind=null;
    // ---- audio
    const btn=document.getElementById('snd');
    let ac=null, rubG=null, master=null, windG=null, windBP=null, noiseBuf=null, soundOn=false;
    function initAudio(){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination);
      const len=ac.sampleRate*3; noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
      const d=noiseBuf.getChannelData(0); let last=0;
      for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; }
      const src=ac.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
      windBP=ac.createBiquadFilter(); windBP.type='bandpass'; windBP.frequency.value=400; windBP.Q.value=.7;
      windG=ac.createGain(); windG.gain.value=0;
      src.connect(windBP); windBP.connect(windG); windG.connect(master); src.start();
      const rs=ac.createBufferSource(); rs.buffer=noiseBuf; rs.loop=true;
      const rl=ac.createBiquadFilter(); rl.type='lowpass'; rl.frequency.value=210; rl.Q.value=.9;
      rubG=ac.createGain(); rubG.gain.value=0; rs.connect(rl); rl.connect(rubG); rubG.connect(master); rs.start();
      SND.rustle=()=>{ if(!soundOn) return; for(let i=0;i<10;i++) setTimeout(()=>{ if(soundOn) noise(.3,'bandpass',2400+Math.random()*1800,1.4,.022,.05,.45); }, i*280+120); };
      SND.crumble=()=>{ if(!soundOn) return; noise(.4,'lowpass',700+Math.random()*500,.8,.06,.01,.35); noise(.3,'bandpass',3000,1.2,.015,.02,.25); };
    }
    function noise(dur, type, freq, q, peak, attack, decay){
      const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=freq; fl.Q.value=q;
      const g=ac.createGain(); const n=ac.currentTime;
      g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(peak,n+attack); g.gain.exponentialRampToValueAtTime(0.0001,n+attack+decay);
      s.connect(fl); fl.connect(g); g.connect(master); s.start(n); s.stop(n+attack+decay+.1);
      return g;
    }
    function impact(){
      const n=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
      o.frequency.setValueAtTime(72,n); o.frequency.exponentialRampToValueAtTime(26,n+.7);
      g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(.9,n+.012); g.gain.exponentialRampToValueAtTime(0.0001,n+1.5);
      o.connect(g); g.connect(master); o.start(n); o.stop(n+1.6);
      noise(.6,'lowpass',260,.7,.9,.008,.55);
      noise(2,'bandpass',1800,.8,.05,.25,2.2);
    }
    function startGrind(){
      const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=140;
      const g=ac.createGain(); g.gain.value=0;
      s.connect(fl); fl.connect(g); g.connect(master); s.start();
      grind={s,g};
    }
    function restart(){
      t0=performance.now(); textOn=false; impacted=false;
      if(grind){ grind.s.stop(); grind=null; }
      wordAt=0; falling=false;
      wd.classList.add('reset'); wd.classList.remove('on'); void wd.offsetWidth;
      spans().forEach(sp=>sp.getAnimations().forEach(a=>a.cancel()));
      requestAnimationFrame(()=>wd.classList.remove('reset'));
    }
    btn.addEventListener('click',()=>{
      if(!soundOn){
        const first=!ac; if(first) initAudio(); else ac.resume();
        soundOn=true; btn.setAttribute('aria-pressed','true');
        if(first && !reduce) restart();
      } else {
        soundOn=false; btn.setAttribute('aria-pressed','false'); ac.suspend();
      }
    });
    (function loop(){
      const el=(performance.now()-t0)/1000;
      const k=Math.min(Math.max((el-DELAY)/(DUR||1e-6),0),1);
      const e=k<.5 ? 8*k*k*k*k : 1-Math.pow(-2*k+2,4)/2;
      const after=el-END;
      const shake = (!reduce && after>0) ? 3.2*Math.exp(-after*11)*Math.sin(after*70) : 0;
      const dist = 820 * Math.max(1, (cv.width/rect[2])*0.9);
      const live=Math.min(Math.max((after-.3)/2.5,0),1);
      const gw=sstep(.35,.85,vn(el*.12));
      // cloud: first pass ~8s after impact, then every 30s
      const ct=after-8, cyc=((ct%30)+30)%30;
      const cloud = (ct>0 && !reduce) ? -3200 + cyc*480 : -1e5;
      const cov = (()=>{ const s=-cloud; const a=sstep(-900,-350,s), b=1-sstep(350,900,s); return a*b; })();
      gl.uniform2f(U('vsz'), cv.width, cv.height);
      gl.uniform4f(U('rc'), rect[0], rect[1], rect[2], rect[3]);
      gl.uniform1f(U('sep'), (1-e)*dist);
      gl.uniform1f(U('shake'), shake);
      gl.uniform1f(U('live'), live);
      gl.uniform1f(U('t'), el);
      gl.uniform1f(U('gw'), gw);
      gl.uniform1f(U('cloud'), cloud);
      gl.uniform1f(U('aft'), reduce?0:after);
      { const pv=cur; cur+=(tgt-cur)*.045; vel=cur-pv; }
      gl.uniform1f(U('shr'), reduce?0:cur*live);
      if(!textOn && after>.6){ textOn=true; showWord(); }
      if(soundOn && ac){
        const now=ac.currentTime;
        if(k>0 && k<1 && !grind && !impacted) startGrind();
        if(grind) grind.g.gain.setTargetAtTime(.35*Math.sin(Math.PI*Math.min(k*1.15,1)), now, .08);
        if(!impacted && after>=0){ impacted=true; if(grind){ grind.g.gain.cancelScheduledValues(now); grind.g.gain.setValueAtTime(0,now); grind.s.stop(now+.05); grind=null; } impact(); }
        rubG.gain.setTargetAtTime(Math.min(Math.abs(vel)*.22,.32)*live, now, .06);
        const ge=gw*(1-.8*cov);
        windG.gain.setTargetAtTime(live*(.025+.11*ge), now, .4);
        windBP.frequency.setTargetAtTime(280+520*ge, now, .5);
      } else if(after>=0) impacted=true;
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      requestAnimationFrame(loop);
    })();
  });
